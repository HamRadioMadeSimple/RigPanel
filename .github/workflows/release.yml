# Making a tag like v1.4.3 (on the Releases page) builds the Windows installer, the Linux .tar.gz
# and the AppImage, then attaches them to that release.  (Actions > Release > Run workflow also
# builds them for testing, without a release.)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        shell: cmd
        run: build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: output/RigPanel_Setup_*.exe

  linux:
    # Built on Ubuntu 22.04 so it also runs on Mint 21 / Ubuntu 22.04 and newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build needs
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv libportaudio2
      - name: Build the .tar.gz and the AppImage
        run: bash build_linux.sh --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            output/RigPanel_Ver_*_Linux.tar.gz
            output/RigPanel-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Release notes from CHANGELOG.md (the first section for this version)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{if (f) exit; f=($2==v)} f' CHANGELOG.md | tail -n +2 > notes.md
          printf '\n---\n**Windows:** `RigPanel_Setup_%s.exe` (if Windows says "protected your PC": More info > Run anyway).  \n**Linux:** `RigPanel_Ver_%s_Linux.tar.gz` (Mint 21 / Ubuntu 22.04 or newer; steps in docs/RigPanel-Linux-Install.pdf) or `RigPanel-x86_64.AppImage`.  \n**Example station (optional):** `KW3KW_settings.json` - load with Settings > Load settings from a file.\n' "$V" "$V" >> notes.md
          cat notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: RigPanel ${{ github.ref_name }}
          body_path: notes.md
          files: |
            out/windows/RigPanel_Setup_*.exe
            out/linux/RigPanel_Ver_*_Linux.tar.gz
            out/linux/RigPanel-x86_64.AppImage
            examples/KW3KW_settings.json
